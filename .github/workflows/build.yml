name: APK + site web

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optionnel : une clé de signature privée en secrets remplace la clé CI du dépôt
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances
        run: npm ci

      - name: Site web (Vite)
        run: npm run build

      - name: Projet Android (Capacitor)
        run: |
          npx cap add android
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#0B0B10' --splashBackgroundColor '#0B0B10' || echo "Icônes par défaut"
          # Connexion Google native
          sed -i '/^ext {/a\    rgcfaIncludeGoogle = true' android/variables.gradle
          cp android-config/google-services.json android/app/google-services.json
          npx cap sync android

      - name: Compilation APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Signature
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.p12
          else
            cp android-config/soiree-ci.p12 release.p12
            export KEYSTORE_PASSWORD=android
          fi
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.p12 --ks-type PKCS12 --ks-key-alias soiree \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out Soiree.apk aligned.apk
          rm release.p12
          $BT/apksigner verify --print-certs Soiree.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: Soiree-apk
          path: Soiree.apk

      - name: Publication (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Soirée v1.${{ github.run_number }}
          make_latest: true
          files: Soiree.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
